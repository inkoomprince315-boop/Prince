<!DOCTYPE html>
<html>
<head>
	
	<title>Login page</title>
	<style>
		body{
			font-family: Arial;
			background-image: url('Church.jpg');
			background-size: cover;
			background-position: center;
			background-repeat: no repeat;
			height: 50px;
			background-color:blue;

		}
		.login-box{
			width: 20px;
			background: skyblue;
			paddling:30px;
			margine:20px auto;
			border-radius: 15px;
			text-align: center;
			box-shadow: 0 0 20px slategray;
		}
		h2{
			color: black;
		}
		input{
			width: 50%; 
			paddling:20px;
			margine:20px 0;
		}
		button{
			background-color: darkblue;
			color: white;
			paddling:20px 30px;
			border: :none;
			width: 50%;
		}
</style>

</head>
<body>
	<div class="Login-box">
		<h2>Church Login</h2>
		<form>
			<input type="text" placeholder="Username" required>     <br>
			<br>

			<input type="password" placeholder="password" required>  <br>
			<br>


			<button type="submit">Login</button> 
		</form> <br>
		
	</div>
</body>
</html>
